<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
       <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="container py-5">

        <div class="row g-4">

               <div class="col-lg-5">

            <div class="card shadow-lg p-4 border-0 rounded-4">

                <h2 class="text-center mb-4">
                    Create Your Bio Link
                </h2>

                <div class="mb-3">
                    <label class="form-label">Your Name</label>
                    <input type="text" id="nameInput" class="form-control" placeholder="Enter name">
                </div>

                <div class="mb-3">
                    <label class="form-label">Bio</label>
                    <textarea id="bioInput" class="form-control" rows="3" placeholder="Enter bio"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Profile Image URL</label>
                    <input type="text" id="imgInput" class="form-control" placeholder="Paste image URL">
                </div>

                <div class="mb-3">
                    <label class="form-label">Instagram Link</label>
                    <input type="text" id="instaInput" class="form-control" placeholder="Instagram URL">
                </div>

                <div class="mb-3">
                    <label class="form-label">LinkedIn Link</label>
                    <input type="text" id="linkedinInput" class="form-control" placeholder="LinkedIn URL">
                </div>

                <div class="mb-3">
                    <label class="form-label">Spotify Link</label>
                    <input type="text" id="spotifyInput" class="form-control" placeholder="Spotify URL">
                </div>

                <button class="btn btn-primary w-100" onclick="generateProfile()">
                    Generate Bio Page
                </button>

            </div>

        </div>

         <div class="col-lg-7">

            <div class="preview-card text-center shadow-lg">

                <img src="https://i.pravatar.cc/150"
                     id="previewImg"
                     class="profile-img"
                     alt="Profile">

                <h2 id="previewName">Your Name</h2>

                <p id="previewBio">
                    Your short bio will appear here.
                </p>

                <div class="d-grid gap-3 mt-4">

                    <a href="#" id="instaLink" class="btn btn-instagram" target="_blank">
                        Instagram
                    </a>

                    <a href="#" id="linkedinLink" class="btn btn-linkedin" target="_blank">
                        LinkedIn
                    </a>

                    <a href="#" id="spotifyLink" class="btn btn-spotify" target="_blank">
                        Spotify
                    </a>

                </div>

            </div>

        </div>

        </div>
    </div> 
    
    <script src="script.js"></script>
    
</body>
</html>
